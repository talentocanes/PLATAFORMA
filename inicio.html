<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Talento Canes · Inicio</title>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barkly">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="theme-inline.js"></script>
<link rel="stylesheet" href="panel.css">
<style>
  /* Accesos: cuadrícula de módulos disponibles. Deliberadamente sobria
     — no compite con lo que necesita atención, que va antes. */
  .accesos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:var(--s-3); }
  .acceso{
    position:relative;
    display:flex; align-items:center; gap:var(--s-3);
    min-height:64px; padding:var(--s-3) var(--s-4);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    color:var(--text); font-weight:600; font-size:var(--t-base);
    transition:border-color .13s ease, background .13s ease;
  }
  .acceso:hover{ border-color:var(--border-2); background:var(--surface-2); }
  .acceso .ico{
    width:36px; height:36px; border-radius:var(--r-sm); flex-shrink:0;
    background:var(--acento-suave); color:var(--acento-txt);
    display:flex; align-items:center; justify-content:center;
  }
  .acceso .ico svg{ width:19px; height:19px; }
  .acceso .count{ margin-left:auto; }

  /* Aviso: una sola franja, sin tarjeta dentro de tarjeta */
  .aviso{
    display:flex; align-items:flex-start; gap:var(--s-3);
    padding:var(--s-4); border-radius:var(--r-md);
    background:var(--warn-bg); border:1px solid var(--warn-br); color:var(--warn);
    margin-bottom:var(--s-5);
  }
  .aviso svg{ width:20px; height:20px; flex-shrink:0; margin-top:1px; }
  .aviso .t{ font-weight:600; font-size:var(--t-base); margin-bottom:2px; }
  .aviso .d{ font-size:var(--t-sm); line-height:1.5; color:var(--text-2); }

  .sec-title{
    display:flex; align-items:center; gap:var(--s-2);
    font-size:var(--t-md); font-weight:700; letter-spacing:-0.01em;
    margin:var(--s-8) 0 var(--s-4);
  }
  .sec-title .vivo{
    display:inline-flex; align-items:center; gap:5px;
    font-size:var(--t-xs); font-weight:500; color:var(--ok);
  }
  .sec-title .vivo i{ width:6px; height:6px; border-radius:50%; background:var(--ok); }

  .saludo{ font-size:var(--t-2xl); font-weight:700; letter-spacing:-0.03em; }
  .saludo span{ color:var(--acento-txt); }
  @media (max-width:1023px){ .saludo{ font-size:var(--t-xl); } }
</style>
</head>
<body>

  <script src="shell-inline.js" data-active="inicio" data-title="Inicio"></script>

  <main>
    <div class="page-head">
      <div>
        <div class="saludo" id="saludo">Hola.</div>
        <div class="sub" id="subSaludo">—</div>
      </div>
    </div>

    <!-- Acudiente con mascotas sin carné -->
    <div class="aviso" id="avisoCarne" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      <div>
        <div class="t">Falta el carné de vacunación</div>
        <div class="d" id="avisoCarneTexto"></div>
      </div>
    </div>

    <div class="stats-row" id="cifras"></div>

    <!-- Solicitudes de acceso, solo administrador -->
    <div id="seccionSolicitudes" style="display:none;">
      <div class="sec-title">
        Solicitudes de acceso
        <span class="vivo"><i></i>En vivo</span>
      </div>
      <div id="listaSolicitudes"></div>
    </div>

    <div class="sec-title">Accesos</div>
    <div class="accesos" id="accesos"></div>
  </main>



  <script type="module">
    import { initLayout, obtenerConfiguracionActual } from './layout.js';
    import { supabase } from './supabaseClient.js';
    import { escapar, pesos, htmlAvatar } from './ui.js';

    let etiquetaCliente = 'Acudiente';

    const profile = await initLayout({ activeKey: 'inicio' });
    if (profile) {
      const config = obtenerConfiguracionActual();
      etiquetaCliente = config?.etiqueta_cliente || 'Acudiente';

      pintarSaludo(profile);
      pintarAccesos();

      if (profile.role === 'cliente') {
        await Promise.all([cifrasAcudiente(profile.id), revisarCarne(profile.id)]);
      } else {
        await cifrasColegio(profile);
        if (profile.role === 'admin') {
          document.getElementById('seccionSolicitudes').style.display = 'block';
          await cargarSolicitudes();
          suscribirEnVivo();
        }
      }

      window.BarklyShell?.listo?.();
    }

    /* ---------------- Saludo ---------------- */
    function pintarSaludo(profile){
      const hora = new Date().getHours();
      const franja = hora < 12 ? 'Buenos días' : (hora < 19 ? 'Buenas tardes' : 'Buenas noches');
      const nombre = (profile.full_name || profile.username).split(' ')[0];
      document.getElementById('saludo').innerHTML =
        `${franja}, <span>${escapar(nombre)}</span>.`;

      const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const hoy = new Date();
      const fecha = dias[hoy.getDay()] + ', ' + hoy.getDate() + ' de ' + meses[hoy.getMonth()];
      document.getElementById('subSaludo').textContent =
        fecha.charAt(0).toUpperCase() + fecha.slice(1);
    }

    /* ---------------- Accesos ----------------
       Se arman con los módulos que el armazón ya resolvió, así que
       cada quien ve solo lo que puede abrir — nada de tarjetas
       "Próximamente" que no llevan a ningún lado. */
    function pintarAccesos(){
      const cont = document.getElementById('accesos');
      const modulos = window.BarklyShell.disponibles()
        .filter(m => m.key !== 'inicio');

      cont.innerHTML = modulos.map(m => `
        <a class="acceso" href="${m.href}">
          <span class="ico">${m.icono}</span>
          <span>${escapar(m.label)}</span>
          ${m.badge ? `<span class="count">${m.badge}</span>` : ''}
        </a>
      `).join('');
    }

    /* ---------------- Cifras ---------------- */
    function tarjeta(lbl, val, clase = ''){
      return `<div class="stat"><div class="lbl">${lbl}</div><div class="val ${clase}">${val}</div></div>`;
    }

    async function cifrasColegio(profile){
      const cont = document.getElementById('cifras');
      cont.innerHTML = `<div class="stat"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:24px;margin-top:8px"></div></div>`.repeat(3);

      const [alumnos, compras] = await Promise.all([
        supabase.from('alumnos').select('activo, status'),
        supabase.from('compras').select('precio_total, monto_pagado, estado_aprobacion, estado_pago')
      ]);

      const lista = alumnos.data || [];
      const activos = lista.filter(a => a.activo && a.status === 'approved').length;

      let porCobrar = 0, pendientes = 0;
      (compras.data || []).forEach(c => {
        if (c.estado_aprobacion === 'pendiente') { pendientes++; return; }
        if (c.estado_aprobacion !== 'aprobado') return;
        porCobrar += Math.max(0, (Number(c.precio_total) || 0) - (Number(c.monto_pagado) || 0));
      });

      cont.innerHTML =
        tarjeta('Alumnos activos', activos) +
        tarjeta('Por cobrar', pesos(porCobrar), 'debe') +
        tarjeta('Compras por aprobar', pendientes);
    }

    async function cifrasAcudiente(clienteId){
      const cont = document.getElementById('cifras');
      cont.innerHTML = `<div class="stat"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:24px;margin-top:8px"></div></div>`.repeat(2);

      const [mascotas, compras] = await Promise.all([
        supabase.from('alumnos').select('id').eq('acudiente_id', clienteId).eq('status', 'approved'),
        supabase.from('compras').select('precio_total, monto_pagado, estado_aprobacion, estado_pago').eq('cliente_id', clienteId)
      ]);

      let porPagar = 0;
      (compras.data || []).forEach(c => {
        if (c.estado_aprobacion !== 'aprobado' || c.estado_pago === 'pagado') return;
        porPagar += Math.max(0, (Number(c.precio_total) || 0) - (Number(c.monto_pagado) || 0));
      });

      cont.innerHTML =
        tarjeta('Por pagar', pesos(porPagar), porPagar > 0 ? 'debe' : '') +
        tarjeta('Mis mascotas', (mascotas.data || []).length);
    }

    /* ---------------- Carné pendiente ---------------- */
    async function revisarCarne(clienteId){
      const { data, error } = await supabase
        .from('alumnos')
        .select('nombre')
        .eq('acudiente_id', clienteId)
        .is('carne_vacunacion_url', null);

      if (error || !data || data.length === 0) return;

      const nombres = data.map(m => m.nombre).join(', ');
      document.getElementById('avisoCarneTexto').textContent = data.length === 1
        ? `A ${nombres} le falta el carné. Súbelo desde Mis mascotas para completar su registro.`
        : `Les falta el carné a ${nombres}. Súbelos desde Mis mascotas para completar su registro.`;
      document.getElementById('avisoCarne').style.display = 'flex';
    }

    /* ---------------- Solicitudes de acceso ---------------- */
    const ROL_TEXTO = () => ({ trabajador: 'Trabajador', cliente: etiquetaCliente });

    async function cargarSolicitudes(){
      const cont = document.getElementById('listaSolicitudes');
      const { data, error } = await supabase
        .from('profiles')
        .select('id, username, full_name, role, created_at')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      if (error) {
        cont.innerHTML = `<div class="card"><div class="empty"><p>No se pudieron cargar las solicitudes.</p></div></div>`;
        return;
      }
      if (!data || data.length === 0) {
        cont.innerHTML = `
          <div class="card">
            <div class="empty" style="padding:var(--s-8) var(--s-6)">
              <div class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 6 9 17l-5-5"/></svg>
              </div>
              <h3>Todo al día</h3>
              <p>No hay solicitudes de acceso esperando respuesta.</p>
            </div>
          </div>`;
        return;
      }

      const roles = ROL_TEXTO();
      cont.innerHTML = `<div class="list">${data.map(p => {
        const nombre = p.full_name || p.username;
        return `
          <div class="list-row">
            ${htmlAvatar(nombre, null)}
            <div class="list-main">
              <div class="list-title">${escapar(nombre)}</div>
              <div class="list-meta">@${escapar(p.username)} · ${escapar(roles[p.role] || p.role)}</div>
            </div>
            <div class="row-gap">
              <button class="btn btn-secondary btn-sm" data-accion="deny" data-id="${p.id}">Denegar</button>
              <button class="btn btn-primary btn-sm" data-accion="approve" data-id="${p.id}">Aceptar</button>
            </div>
          </div>`;
      }).join('')}</div>`;

      cont.querySelectorAll('button[data-accion]').forEach(btn => {
        btn.addEventListener('click', () => resolver(btn.dataset.id, btn.dataset.accion));
      });
    }

    async function resolver(id, accion){
      if (accion === 'approve') {
        const { error } = await supabase.from('profiles').update({ status: 'approved' }).eq('id', id);
        if (error) { alert('No se pudo aprobar la solicitud: ' + error.message); return; }
      } else {
        if (!confirm('¿Denegar esta solicitud? Se elimina por completo y no queda registro.')) return;
        const { error } = await supabase.from('profiles').delete().eq('id', id);
        if (error) { alert('No se pudo denegar la solicitud: ' + error.message); return; }
      }
      await cargarSolicitudes();
    }

    // Requiere Realtime activo sobre la tabla profiles.
    function suscribirEnVivo(){
      supabase
        .channel('profiles-solicitudes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' },
            () => { cargarSolicitudes(); })
        .subscribe();
    }
  </script>
</body>
</html>
