<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento Canes · Completa tu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme-inline.js?v=5"></script>
<style>
  :root{
    --navy-deep:#050d1a; --navy-panel:#0b1a30; --navy-panel-2:#0f2340;
    --blue-deep:#0d47a1; --blue-mid:#1976d2; --blue-bright:#29b6f6; --blue-glow:#4fc3f7;
    --ink:#05070b; --white:#ffffff; --mist:#b7c6dc; --mist-dim:#6f83a0;
    --line:rgba(255,255,255,0.08); --line-strong:color-mix(in srgb, var(--blue-glow) 25%, transparent);
    --danger:#ff6b6b; --radius:18px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ font-family:'Inter',sans-serif; }
  body{
    min-height:100vh; color:var(--white);
    background:
      radial-gradient(1200px 700px at 85% -10%, color-mix(in srgb, var(--blue-bright) 16%, transparent), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, color-mix(in srgb, var(--blue-deep) 22%, transparent), transparent 60%),
      var(--navy-deep);
    padding:0 20px;
  }
  .card{
    width:100%; max-width:480px;
    margin-top:2rem; margin-bottom:3rem; margin-left:auto; margin-right:auto;
    background:var(--navy-panel); border:1px solid var(--line-strong);
    border-radius:20px; padding:26px 30px;
  }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--blue-glow); margin-bottom:6px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:21px; margin-bottom:5px; }
  .lead{ color:var(--mist-dim); font-size:12.5px; line-height:1.5; margin-bottom:16px; }

  .section-title{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mist-dim); margin:14px 0 8px; }
  .section-title:first-of-type{ margin-top:0; }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:12px; color:var(--mist); margin-bottom:4px; }
  .field input{ width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--ink); color:var(--white); font-size:13.5px; outline:none; }
  .field input:focus{ border-color:var(--blue-bright); }
  .field input:disabled{ opacity:.6; cursor:not-allowed; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .grid-2{ grid-template-columns:1fr; } }

  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:42px; }
  .toggle-password{ position:absolute; top:50%; right:6px; transform:translateY(-50%); width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:none; border:none; padding:0; cursor:pointer; color:var(--mist-dim); }
  .toggle-password svg{ width:18px; height:18px; }
  .toggle-password .eye-off{ display:none; }
  .toggle-password.showing .eye{ display:none; }
  .toggle-password.showing .eye-off{ display:block; }

  .btn-save{ width:100%; margin-top:14px; padding:11px; border:none; border-radius:10px; background:linear-gradient(90deg, var(--blue-deep), var(--blue-bright)); color:var(--white); font-weight:600; font-size:14px; cursor:pointer; }
  .btn-save:disabled{ opacity:.6; cursor:default; }

  .msg{ margin-top:10px; padding:9px 12px; border-radius:9px; font-size:12px; line-height:1.4; display:none; }
  .msg.error{ display:block; background:rgba(255,107,107,0.12); color:var(--danger); border:1px solid rgba(255,107,107,0.3); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Talento Canes · Último paso</div>
    <h1>Completa tu perfil</h1>
    <p class="lead">Antes de continuar, confirma tu correo y define una nueva contraseña. Solo tienes que hacerlo una vez.</p>

    <form id="onboardingForm" autocomplete="off">
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="username" disabled autocomplete="off">
      </div>
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" autocomplete="off">
      </div>

      <div class="section-title">Seguridad</div>
      <div class="field">
        <label>Contraseña temporal (la que te dieron)</label>
        <div class="password-wrap">
          <input type="password" id="currentPassword" autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Mostrar">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Nueva contraseña</label>
          <div class="password-wrap">
            <input type="password" id="newPassword" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="newPassword" aria-label="Mostrar">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label>Confirmar contraseña</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-save" id="saveBtn">Guardar y continuar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script type="module">
    import { protegerPagina } from './auth.js?v=5';
    import { supabase, usernameToEmail } from './supabaseClient.js?v=5';
    import { cargarConfiguracionNegocio } from './theme.js?v=5';

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    function forzarScrollArriba(){ window.scrollTo(0, 0); }
    forzarScrollArriba();
    window.addEventListener('load', forzarScrollArriba);
    setTimeout(forzarScrollArriba, 50);
    setTimeout(forzarScrollArriba, 300);
    setTimeout(forzarScrollArriba, 800);

    cargarConfiguracionNegocio();

    let profile = null;

    (async () => {
      profile = await protegerPagina({ rolesPermitidos: ['trabajador'] });
      if (!profile) return;

      // Si ya no requiere cambio de contraseña, no debería estar aquí
      if (!profile.requiere_cambio_password) {
        window.location.href = 'inicio.html';
        return;
      }

      document.getElementById('username').value = profile.username;

      const { data: detalle } = await supabase
        .from('trabajador_detalle')
        .select('correo')
        .eq('id', profile.id)
        .single();
      if (detalle?.correo) document.getElementById('correo').value = detalle.correo;

      forzarScrollArriba();
      setTimeout(forzarScrollArriba, 50);
      setTimeout(forzarScrollArriba, 300);
    })();

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.classList.toggle('showing', !showing);
      });
    });

    const msg = document.getElementById('msg');
    function showError(text){
      msg.textContent = text;
      msg.className = 'msg error';
    }

    document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const btn = document.getElementById('saveBtn');

      const correo = document.getElementById('correo').value.trim();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!correo) {
        showError('El correo electrónico es obligatorio.');
        return;
      }
      if (!currentPassword || !newPassword) {
        showError('Debes ingresar tu contraseña temporal y definir la nueva.');
        return;
      }
      if (newPassword.length < 6) {
        showError('La nueva contraseña debe tener al menos 6 caracteres.');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError('Las contraseñas no coinciden.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando…';

      try {
        const email = usernameToEmail(profile.username);
        const { error: verifyErr } = await supabase.auth.signInWithPassword({ email, password: currentPassword });
        if (verifyErr) throw new Error('La contraseña temporal no es correcta.');

        const { error: updateErr } = await supabase.auth.updateUser({ password: newPassword });
        if (updateErr) throw new Error(updateErr.message);

        const { error: rpcErr } = await supabase.rpc('completar_perfil_trabajador', { p_correo: correo });
        if (rpcErr) throw new Error(rpcErr.message);

        window.location.href = 'inicio.html';
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Guardar y continuar';
      }
    });
  </script>
</body>
</html>
