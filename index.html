<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Talento Canes · Iniciar sesión</title>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barkly">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="theme-inline.js?v=27"></script>
<link rel="stylesheet" href="panel.css?v=27">
<style>
  /* Las páginas de acceso no tienen armazón: solo una tarjeta
     centrada. Todo lo demás sale de los tokens de panel.css, así
     que también responden a la paleta y al modo claro/oscuro. */
  body{ padding:0 var(--s-4); }

  .card-auth{
    width:100%; max-width:400px;
    margin:var(--s-14) auto var(--s-18);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-2);
    padding:var(--s-8) var(--s-6);
  }
  @media (max-width:520px){
    .card-auth{ margin-top:var(--s-8); padding:var(--s-6) var(--s-5); }
  }

  .brand{ display:flex; align-items:center; gap:var(--s-3); margin-bottom:var(--s-8); }
  .brand img{ width:44px; height:44px; border-radius:var(--r-md); object-fit:cover; }
  .brand .name{ font-weight:700; font-size:var(--t-md); letter-spacing:-0.01em; }
  .brand .sub{ font-size:var(--t-xs); color:var(--text-3); margin-top:1px; }

  h1{ font-size:var(--t-xl); margin-bottom:6px; }
  .lead{ color:var(--text-2); font-size:var(--t-sm); line-height:1.5; margin-bottom:var(--s-6); }

  .field{ margin-bottom:var(--s-4); }
  .field label{ display:block; font-size:var(--t-sm); font-weight:500; color:var(--text); margin-bottom:6px; }

  .password-wrap{ position:relative; }
  .password-wrap .input{ padding-right:48px; }
  .toggle-password{
    position:absolute; top:50%; right:4px; transform:translateY(-50%);
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; cursor:pointer; color:var(--text-3);
    border-radius:var(--r-full);
  }
  .toggle-password:hover{ color:var(--text-2); background:var(--surface-2); }
  .toggle-password svg{ width:19px; height:19px; }
  .toggle-password .eye-off{ display:none; }
  .toggle-password.showing .eye{ display:none; }
  .toggle-password.showing .eye-off{ display:block; }

  .remember-row{ display:flex; align-items:center; gap:10px; min-height:44px; margin-bottom:var(--s-4); }
  .remember-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--acento); cursor:pointer; flex-shrink:0; }
  .remember-row label{ font-size:var(--t-sm); color:var(--text-2); cursor:pointer; }

  .msg{ margin-top:var(--s-4); padding:var(--s-3) var(--s-4); border-radius:var(--r-sm); font-size:var(--t-sm); line-height:1.5; display:none; }
  .msg.error{ display:block; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-br); }
  .msg.info{ display:block; background:var(--acento-suave); color:var(--acento-txt); border:1px solid transparent; }
</style>
</head>
<body>
  <div class="card-auth">
    <div class="brand">
      <img src="logo.png" alt="" id="brandLogo">
      <div>
        <div class="name" id="brandName">Talento Canes</div>
        <div class="sub">Barkly</div>
      </div>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="lead">Entra con tu usuario y contraseña para acceder al panel.</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Usuario o correo</label>
        <input class="input" id="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input class="input" id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberCheckbox" checked>
        <label for="rememberCheckbox">Mantener la sesión iniciada</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script type="module">
    // IMPORTANTE: todos los imports del proyecto deben usar la MISMA
    // versión. Si esta página pide supabaseClient.js?v=12 y theme.js
    // pide ?v=27, el navegador los trata como dos archivos distintos y
    // acaba habiendo dos clientes de Supabase compitiendo por el mismo
    // candado de sesión — el login se queda colgado sin dar error.
    import { iniciarSesion } from './auth.js?v=27';
    import { supabase, definirRecordarSesion } from './supabaseClient.js?v=27';
    import { cargarConfiguracionNegocio } from './theme.js?v=27';

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    cargarConfiguracionNegocio().then(config => {
      if (!config) return;
      if (config.nombre_negocio) document.getElementById('brandName').textContent = config.nombre_negocio;
      if (config.logo_url) document.getElementById('brandLogo').src = config.logo_url;
    });

    // Si ya hay sesión activa, no se muestra el formulario: entra directo.
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'inicio.html';
    })();

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const rememberCheckbox = document.getElementById('rememberCheckbox');

    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggleBtn.classList.toggle('showing', !showing);
      toggleBtn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });

    function showMessage(text, type){
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando…';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Se define ANTES de iniciar sesión, para que ese mismo login ya
      // use el almacén correcto (localStorage o sessionStorage).
      definirRecordarSesion(rememberCheckbox.checked);

      try {
        await iniciarSesion(username, password);
        window.location.href = 'inicio.html';
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
