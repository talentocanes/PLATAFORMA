<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento Canes · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#050d1a; --navy-panel:#0b1a30; --blue-deep:#0d47a1;
    --blue-bright:#29b6f6; --blue-glow:#4fc3f7; --ink:#05070b;
    --white:#ffffff; --mist:#b7c6dc; --mist-dim:#6f83a0;
    --line:rgba(255,255,255,0.08); --line-strong:color-mix(in srgb, var(--blue-glow) 25%, transparent);
    --danger:#ff6b6b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; font-family:'Inter',sans-serif; }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; color:var(--white);
    background:
      radial-gradient(1200px 700px at 85% -10%, color-mix(in srgb, var(--blue-bright) 16%, transparent), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, color-mix(in srgb, var(--blue-deep) 22%, transparent), transparent 60%),
      var(--navy-deep);
    padding:20px;
    transition: background-color .3s ease;
  }
  .card{
    width:100%; max-width:380px;
    background:var(--navy-panel);
    border:1px solid var(--line-strong);
    border-radius:20px;
    padding:36px 32px;
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brand img{ width:44px; height:44px; }
  .brand .name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
  .brand .sub{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.3px; color:var(--blue-glow); text-transform:uppercase; margin-top:2px; }

  h1{ font-family:'Space Grotesk',sans-serif; font-size:21px; margin-bottom:6px; }
  .lead{ color:var(--mist-dim); font-size:13px; margin-bottom:26px; }

  label{ display:block; font-size:12px; color:var(--mist); margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  input{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1px solid var(--line); background:var(--ink);
    color:var(--white); font-size:14px; outline:none;
    transition:border-color .2s ease;
  }
  input:focus{ border-color:var(--blue-bright); }

  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:42px; }
  .toggle-password{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; margin:0; cursor:pointer;
    color:var(--mist-dim);
  }
  .toggle-password:hover{ color:var(--mist); }
  .toggle-password svg{ width:19px; height:19px; }
  .toggle-password .eye-off{ display:none; }
  .toggle-password.showing .eye{ display:none; }
  .toggle-password.showing .eye-off{ display:block; }

  button{
    width:100%; margin-top:6px; padding:12px; border:none; border-radius:10px;
    background:linear-gradient(90deg, var(--blue-deep), var(--blue-bright));
    color:var(--white); font-weight:600; font-size:14px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }

  .msg{
    margin-top:16px; padding:10px 12px; border-radius:10px;
    font-size:12.5px; line-height:1.5; display:none;
  }
  .msg.error{ display:block; background:rgba(255,107,107,0.12); color:var(--danger); border:1px solid rgba(255,107,107,0.3); }
  .msg.info{ display:block; background:color-mix(in srgb, var(--blue-bright) 10%, transparent); color:var(--blue-glow); border:1px solid var(--line-strong); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Talento Canes" id="brandLogo">
      <div>
        <div class="name" id="brandName">Talento Canes</div>
        <div class="sub">SGITC · Panel</div>
      </div>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="lead">Ingresa con tu usuario y contraseña para acceder al panel.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario o correo</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="submitBtn">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script type="module">
    import { iniciarSesion } from './auth.js';
    import { cargarConfiguracionNegocio } from './theme.js';

    cargarConfiguracionNegocio().then(config => {
      if (!config) return;
      if (config.nombre_negocio) document.getElementById('brandName').textContent = config.nombre_negocio;
      if (config.logo_url) document.getElementById('brandLogo').src = config.logo_url;
    });

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggleBtn.classList.toggle('showing', !showing);
      toggleBtn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });

    function showMessage(text, type){
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando…';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        await iniciarSesion(username, password);
        window.location.href = 'inicio.html';
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
