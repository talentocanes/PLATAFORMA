<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barkly">
<title>Talento Canes · Alumno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<script src="theme-inline.js"></script>
<style>
  .back-link{ display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 var(--s-2) 0 0; font-size:var(--t-sm); font-weight:500; color:var(--text-2); background:none; border:none; cursor:pointer; margin-bottom:var(--s-3); }
  .back-link:hover{ color:var(--text); }
  .back-link svg{ width:16px; height:16px; }

  /* ---------- Cabecera ---------- */
  .pet-header{ display:flex; align-items:center; gap:var(--s-5); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:var(--s-5); margin-bottom:var(--s-5); flex-wrap:wrap; }
  .pet-avatar{ width:78px; height:78px; border-radius:var(--r-full); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--surface-3); color:#fff; font-size:var(--t-2xl); font-weight:700; }
  .pet-avatar img{ width:100%; height:100%; object-fit:cover; }
  .pet-main{ flex:1; min-width:180px; }
  .pet-main h1{ font-size:var(--t-2xl); }
  .pet-sub{ font-size:var(--t-sm); color:var(--text-2); margin-top:4px; }
  .pet-tags{ display:flex; gap:6px; margin-top:var(--s-3); flex-wrap:wrap; }
  .pet-actions{ display:flex; gap:var(--s-2); flex-wrap:wrap; }

  .tag-base{ display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:var(--r-full); font-size:var(--t-xs); font-weight:600; white-space:nowrap; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .tag-base.si{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok-br); }
  .tag-base.no{ background:var(--surface-2); color:var(--text-3); }
  .tag-base.pend{ background:var(--warn-bg); color:var(--warn); border-color:var(--warn-br); }
  .tag-base.macho, .tag-base.hembra{ background:var(--surface-2); color:var(--text-2); }

  /* ---------- Tarjetas ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:var(--s-5); margin-bottom:var(--s-5); }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-3); margin-bottom:var(--s-4); flex-wrap:wrap; }
  .card-title{ font-size:var(--t-md); font-weight:700; letter-spacing:-0.01em; }
  .card-sub{ font-size:var(--t-sm); color:var(--text-2); margin-top:2px; }

  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:var(--s-4); }
  .info-item{ font-size:var(--t-base); }
  .info-item b{ display:block; font-size:var(--t-sm); color:var(--text-2); font-weight:500; margin-bottom:3px; }

  /* ---------- Acudiente ---------- */
  .duenio{ display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; }
  .duenio-avatar{ width:46px; height:46px; border-radius:var(--r-full); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:var(--t-base); font-weight:700; color:#fff; }
  .duenio-info{ flex:1; min-width:140px; }
  .duenio-nombre{ font-size:var(--t-base); font-weight:600; }
  .nombre-link{ cursor:pointer; border-bottom:1px solid transparent; display:inline-block; }
  .nombre-link:hover{ color:var(--acento-txt); border-bottom-color:currentColor; }
  .duenio-meta{ font-size:var(--t-sm); color:var(--text-2); margin-top:2px; }

  /* ---------- Carné ---------- */
  .carne-box{ display:flex; align-items:center; gap:var(--s-4); flex-wrap:wrap; }
  .carne-thumb{ width:104px; height:104px; border-radius:var(--r-md); overflow:hidden; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .carne-thumb img{ width:100%; height:100%; object-fit:cover; }
  .carne-thumb svg{ width:28px; height:28px; color:var(--text-3); }
  .carne-falta{ display:flex; align-items:flex-start; gap:var(--s-2); padding:var(--s-3) var(--s-4); border-radius:var(--r-sm); background:var(--warn-bg); border:1px solid var(--warn-br); color:var(--warn); font-size:var(--t-sm); line-height:1.45; }
  .carne-falta svg{ width:17px; height:17px; flex-shrink:0; margin-top:1px; }

  /* ---------- Compras ---------- */
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:var(--s-3); margin-bottom:var(--s-4); }
  .stat-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s-4); }
  .stat-label{ font-size:var(--t-sm); color:var(--text-2); margin-bottom:5px; }
  .stat-value{ font-size:var(--t-xl); font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stat-value.debe{ color:var(--danger); }

  .hist-lista{ border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
  .hist-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-3); padding:var(--s-3) var(--s-4); border-bottom:1px solid var(--border); }
  .hist-row:last-child{ border-bottom:none; }
  .hist-item{ font-size:var(--t-base); font-weight:500; }
  .hist-meta{ font-size:var(--t-sm); color:var(--text-2); margin-top:2px; line-height:1.45; }
  .hist-der{ text-align:right; white-space:nowrap; flex-shrink:0; }
  .hist-valor{ font-size:var(--t-base); font-weight:600; font-variant-numeric:tabular-nums; }
  .hist-estado{ display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:var(--r-full); margin-top:5px; font-size:var(--t-xs); font-weight:600; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .hist-estado.pagada{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok-br); }
  .hist-estado.porpagar{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger-br); }
  .hist-estado.abonada{ background:var(--acento-suave); color:var(--acento-txt); border-color:transparent; }

  .empty-note{ color:var(--text-2); font-size:var(--t-base); padding:var(--s-10) var(--s-5); text-align:center; }

  .btn-icon{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 var(--s-4); border-radius:var(--r-sm); border:1px solid var(--border-2); background:var(--surface); color:var(--text); font-size:var(--t-sm); font-weight:500; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .btn-icon:hover{ background:var(--surface-2); }
  .btn-icon svg{ width:15px; height:15px; }

  @media (max-width:680px){
    .card{ padding:var(--s-4); }
    .pet-header{ padding:var(--s-4); gap:var(--s-4); }
    .pet-main h1{ font-size:var(--t-xl); }
    .pet-actions{ width:100%; }
    .pet-actions .btn-icon{ flex:1; height:46px; }
    .stats-row{ grid-template-columns:1fr 1fr; }
    .stats-row > .stat-box:last-child:nth-child(odd){ grid-column:1 / -1; }
  }
</style>
</head>
<body>

  <script src="shell-inline.js" data-active="alumnos"></script>

  <main>
    <button class="back-link" id="btnVolver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="volverLabel">Volver a alumnos</span>
    </button>

    <!-- Cabecera -->
    <div class="pet-header">
      <div class="pet-avatar" id="pFoto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="16.2" rx="4.1" ry="3.3"/><ellipse cx="6.4" cy="9" rx="1.5" ry="1.9"/><ellipse cx="10.6" cy="6.3" rx="1.5" ry="1.9"/><ellipse cx="14.4" cy="6.3" rx="1.5" ry="1.9"/><ellipse cx="18.6" cy="9" rx="1.5" ry="1.9"/></svg>
      </div>
      <div class="pet-main">
        <h1 id="pNombre">Cargando…</h1>
        <div class="pet-sub" id="pResumen"></div>
        <div class="pet-tags" id="pTags"></div>
      </div>
      <div class="pet-actions" id="pActions"></div>
    </div>

    <!-- Información -->
    <div class="card">
      <div class="card-head"><div class="card-title">Información</div></div>
      <div class="info-grid">
        <div class="info-item"><b>Raza</b><span id="iRaza">—</span></div>
        <div class="info-item"><b>Sexo</b><span id="iSexo">—</span></div>
        <div class="info-item"><b>Fecha de nacimiento</b><span id="iNacimiento">—</span></div>
        <div class="info-item"><b>Edad</b><span id="iEdad">—</span></div>
        <div class="info-item"><b>Color o pelaje</b><span id="iColor">—</span></div>
        <div class="info-item"><b>Registrado el</b><span id="iRegistro">—</span></div>
      </div>
    </div>

    <!-- Dueño -->
    <div class="card" id="cardDuenio" style="display:none;">
      <div class="card-head"><div class="card-title" id="tituloDuenio">Acudiente</div></div>
      <div class="duenio" id="duenioBox">
        <div class="empty-note" style="padding:8px;">Cargando…</div>
      </div>
    </div>

    <!-- Carné -->
    <div class="card">
      <div class="card-head"><div class="card-title">Carné de vacunación</div></div>
      <div id="carneWrap"><div class="empty-note">Cargando…</div></div>
    </div>

    <!-- Compras -->
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Compras</div>
          <div class="card-sub">Servicios y productos adquiridos para esta mascota.</div>
        </div>
      </div>
      <div id="comprasWrap"><div class="empty-note">Cargando…</div></div>
    </div>
  </main>

  <script type="module">
    import { initLayout } from './layout.js';
    import { supabase } from './supabaseClient.js';
    import { colorDeNombre, iniciales } from './ui.js';

    // Las navegaciones hechas desde código pasan por el armazón, para
    // que muestren el mismo indicador de carga que los enlaces.
    window.irA = function(url){
      if (window.BarklyShell?.navegar) window.BarklyShell.navegar(url);
      else window.location.href = url;
    };


    const params = new URLSearchParams(window.location.search);
    const ALUMNO_ID = params.get('id');

    // initLayout necesita saber de antemano bajo qué módulo se abre la
    // página, y el rol solo se confirma después. Se usa el perfil que
    // layout.js ya dejó cacheado en la navegación anterior.
    let rolCache = null;
    try { rolCache = JSON.parse(localStorage.getItem('tc_perfil_cache') || 'null')?.role; } catch (e) { /* ignorar */ }
    const CLAVE_MENU = rolCache === 'cliente' ? 'mis-mascotas' : 'alumnos';
    document.querySelector('#sidebar')?.setAttribute('data-active', CLAVE_MENU);

    let perfil = null;
    let alumno = null;
    let puedeEditar = false;

    const RAZAS_CONOCIDAS = ['Labrador Retriever','Golden Retriever','Pastor Alemán','Bulldog Francés','Poodle / Caniche','Chihuahua','Beagle','Schnauzer','Yorkshire Terrier','Boxer','Rottweiler','Husky Siberiano'];

    function escapar(t){
      return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }
    function pesos(n){ return '$ ' + Number(n || 0).toLocaleString('es-CO'); }
    function fechaCorta(iso){
      if (!iso) return '—';
      const d = iso.length <= 10 ? new Date(iso + 'T00:00:00') : new Date(iso);
      return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
    }
    function calcularEdadTexto(iso){
      if (!iso) return null;
      const nac = new Date(iso + 'T00:00:00');
      const hoy = new Date();
      let meses = (hoy.getFullYear() - nac.getFullYear()) * 12 + (hoy.getMonth() - nac.getMonth());
      if (hoy.getDate() < nac.getDate()) meses--;
      if (meses < 0) return null;
      const anios = Math.floor(meses / 12);
      const resto = meses % 12;
      if (anios === 0) return `${resto} ${resto === 1 ? 'mes' : 'meses'}`;
      if (resto === 0) return `${anios} ${anios === 1 ? 'año' : 'años'}`;
      return `${anios} ${anios === 1 ? 'año' : 'años'} y ${resto} ${resto === 1 ? 'mes' : 'meses'}`;
    }

    (async () => {
      const profile = await initLayout({ activeKey: CLAVE_MENU });
      if (!profile) return;
      perfil = profile;

      if (profile.role === 'admin') {
        puedeEditar = true;
      } else if (profile.role === 'trabajador') {
        const { data } = await supabase
          .from('trabajador_detalle')
          .select('modulos_edicion')
          .eq('id', profile.id)
          .single();
        puedeEditar = !!data?.modulos_edicion?.includes('alumnos');
      }

      if (profile.role === 'cliente') {
        document.getElementById('volverLabel').textContent = 'Volver a mis mascotas';
      }

      if (!ALUMNO_ID) {
        document.getElementById('pNombre').textContent = 'Falta el identificador.';
        return;
      }

      await cargarAlumno();
      if (!alumno) return;
      await Promise.all([cargarDuenio(), cargarCompras()]);
    })();

    document.getElementById('btnVolver').addEventListener('click', () => {
      window.irA(perfil?.role === 'cliente' ? 'mis-mascotas.html' : 'alumnos.html');
    });

    async function cargarAlumno(){
      const { data, error } = await supabase
        .from('alumnos')
        .select('*')
        .eq('id', ALUMNO_ID)
        .single();

      if (error || !data) {
        document.getElementById('pNombre').textContent = 'No se pudo cargar la ficha.';
        return;
      }

      // Un acudiente solo puede abrir la ficha de sus propias mascotas.
      if (perfil.role === 'cliente' && data.acudiente_id !== perfil.id) {
        window.irA('mis-mascotas.html');
        return;
      }

      alumno = data;
      document.title = `Talento Canes · ${data.nombre}`;
      document.getElementById('pNombre').textContent = data.nombre || '—';

      const foto = document.getElementById('pFoto');
      if (data.foto_url) {
        foto.innerHTML = `<img src="${escapar(data.foto_url)}" alt="${escapar(data.nombre)}">`;
      } else {
        foto.textContent = iniciales(data.nombre);
        foto.style.background = colorDeNombre(data.nombre);
      }

      const resumen = [data.raza || 'Raza sin definir'];
      if (data.es_mestizo) resumen.push('mestizo');
      const edad = calcularEdadTexto(data.fecha_nacimiento);
      if (edad) resumen.push(edad);
      document.getElementById('pResumen').textContent = resumen.join(' · ');

      const tags = [];
      if (data.status === 'pending') {
        tags.push('<span class="tag-base pend">Pendiente de aprobación</span>');
      } else {
        tags.push(`<span class="tag-base ${data.activo ? 'si' : 'no'}">${data.activo ? 'Activo' : 'Inactivo'}</span>`);
      }
      if (data.sexo) tags.push(`<span class="tag-base ${data.sexo}">${data.sexo === 'macho' ? 'Macho' : 'Hembra'}</span>`);
      tags.push(`<span class="tag-base ${data.carne_vacunacion_url ? 'si' : 'no'}">${data.carne_vacunacion_url ? 'Carné al día' : 'Sin carné'}</span>`);
      document.getElementById('pTags').innerHTML = tags.join('');

      // El botón de editar lleva de vuelta a la lista, donde vive el
      // formulario: la ficha es solo de consulta.
      const acciones = document.getElementById('pActions');
      if (puedeEditar) {
        acciones.innerHTML = `<a class="btn-icon" href="alumnos.html?editar=${data.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Editar</a>`;
      } else if (perfil.role === 'cliente') {
        acciones.innerHTML = `<a class="btn-icon" href="mis-mascotas.html?editar=${data.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Editar</a>`;
      }

      const razaTexto = data.raza
        ? `${data.raza}${data.es_mestizo ? ' (mestizo)' : ''}${!RAZAS_CONOCIDAS.includes(data.raza) ? '' : ''}`
        : 'Sin definir';
      document.getElementById('iRaza').textContent = razaTexto;
      document.getElementById('iSexo').textContent = data.sexo ? (data.sexo === 'macho' ? 'Macho' : 'Hembra') : '—';
      document.getElementById('iNacimiento').textContent = data.fecha_nacimiento ? fechaCorta(data.fecha_nacimiento) : '—';
      document.getElementById('iEdad').textContent = edad || '—';
      document.getElementById('iColor').textContent = data.color_pelaje || '—';
      document.getElementById('iRegistro').textContent = fechaCorta(data.created_at);

      pintarCarne(data.carne_vacunacion_url);
    }

    function pintarCarne(url){
      const wrap = document.getElementById('carneWrap');
      if (!url) {
        wrap.innerHTML = `
          <div class="carne-falta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            Todavía no se ha subido el carné de vacunación.
          </div>`;
        return;
      }

      const esImagen = /\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(url);
      wrap.innerHTML = `
        <div class="carne-box">
          <div class="carne-thumb">
            ${esImagen
              ? `<img src="${escapar(url)}" alt="Carné de vacunación">`
              : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>`}
          </div>
          <div>
            <div style="font-size:13.5px; margin-bottom:9px;">${esImagen ? 'Imagen del carné' : 'Documento del carné'}</div>
            <a class="btn-icon" href="${escapar(url)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
              Abrir en pestaña nueva
            </a>
          </div>
        </div>`;
    }

    async function cargarDuenio(){
      // El acudiente no necesita que le muestren que la mascota es suya.
      if (perfil.role === 'cliente') return;

      const card = document.getElementById('cardDuenio');
      const box = document.getElementById('duenioBox');
      card.style.display = 'block';

      if (!alumno.acudiente_id) {
        box.innerHTML = '<div class="empty-note" style="padding:8px;">Sin acudiente asignado.</div>';
        return;
      }

      const { data, error } = await supabase
        .from('profiles')
        .select('id, username, full_name, phone')
        .eq('id', alumno.acudiente_id)
        .single();

      if (error || !data) {
        box.innerHTML = '<div class="empty-note" style="padding:8px;">No se pudo cargar el acudiente.</div>';
        return;
      }

      const nombre = data.full_name || data.username || '—';
      box.innerHTML = `
        <div class="duenio-avatar" style="background:${colorDeNombre(nombre)}">${escapar(iniciales(nombre))}</div>
        <div class="duenio-info">
          <div class="duenio-nombre nombre-link" data-ficha="${data.id}">${escapar(nombre)}</div>
          <div class="duenio-meta">@${escapar(data.username)}${data.phone ? ' · ' + escapar(data.phone) : ''}</div>
        </div>
        <a class="btn-icon" href="acudiente.html?id=${data.id}">Ver ficha del acudiente</a>`;

      box.querySelectorAll('[data-ficha]').forEach(el => {
        el.addEventListener('click', () => { window.irA(`acudiente.html?id=${el.dataset.ficha}`); });
      });
    }

    function estadoCompra(c){
      if (c.estado_aprobacion === 'pendiente') return { texto:'Por aprobar', clase:'' };
      if (c.estado_aprobacion === 'denegado')  return { texto:'Denegada', clase:'' };
      if (c.estado_pago === 'pagado')          return { texto:'Pagada', clase:'pagada' };
      if (Number(c.monto_pagado) > 0)          return { texto:'Abonada', clase:'abonada' };
      return { texto:'Por pagar', clase:'porpagar' };
    }

    async function cargarCompras(){
      const wrap = document.getElementById('comprasWrap');

      const { data, error } = await supabase
        .from('compras')
        .select('id, nombre_item, categoria_item, cantidad, precio_total, monto_pagado, estado_aprobacion, estado_pago, created_at, fecha_checkin, fecha_checkout, noches')
        .eq('alumno_id', ALUMNO_ID)
        .order('created_at', { ascending: false });

      if (error) {
        wrap.innerHTML = '<div class="empty-note">No se pudieron cargar las compras.</div>';
        return;
      }
      if (!data || data.length === 0) {
        wrap.innerHTML = '<div class="empty-note">Aún no tiene compras registradas.</div>';
        return;
      }

      let totalAprobado = 0;
      let porPagar = 0;
      data.forEach(c => {
        if (c.estado_aprobacion !== 'aprobado') return;
        const t = Number(c.precio_total) || 0;
        totalAprobado += t;
        porPagar += Math.max(0, t - (Number(c.monto_pagado) || 0));
      });

      wrap.innerHTML = `
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">Total aprobado</div>
            <div class="stat-value">${pesos(totalAprobado)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Pendiente por pagar</div>
            <div class="stat-value debe">${pesos(porPagar)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Compras</div>
            <div class="stat-value">${data.length}</div>
          </div>
        </div>
        <div class="hist-lista">
          ${data.map(c => {
            const est = estadoCompra(c);
            const detalles = [fechaCorta(c.created_at)];
            if (c.categoria_item) detalles.push(escapar(c.categoria_item));
            if (c.cantidad > 1) detalles.push(`× ${c.cantidad}`);
            if (c.fecha_checkin && c.fecha_checkout) {
              detalles.push(`${fechaCorta(c.fecha_checkin)} → ${fechaCorta(c.fecha_checkout)}${c.noches ? ` (${c.noches} días)` : ''}`);
            }
            return `
              <div class="hist-row">
                <div>
                  <div class="hist-item">${escapar(c.nombre_item || '—')}</div>
                  <div class="hist-meta">${detalles.join(' · ')}</div>
                </div>
                <div class="hist-der">
                  <div class="hist-valor">${pesos(c.precio_total)}</div>
                  <span class="hist-estado ${est.clase}">${est.texto}</span>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }
  </script>
</body>
</html>
