<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento Canes · Solicitudes de Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<script src="theme-inline.js?v=11"></script>
<style>
  .page-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-header h1{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; }
  .page-header p{ color:var(--mist-dim); font-size:13px; margin-top:4px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--blue-glow); font-size:12.5px; text-decoration:none; margin-bottom:14px; }
  .back-link svg{ width:14px; height:14px; }
  .back-link:hover{ text-decoration:underline; }

  .toolbar-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab-pill{ padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--navy-panel); color:var(--mist); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .tab-pill.active{ border-color:var(--blue-bright); color:var(--white); background:color-mix(in srgb, var(--blue-bright) 12%, transparent); }
  .tab-pill .count{ background:var(--navy-panel-2); font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:1px 7px; border-radius:20px; }

  .empty-note{ color:var(--mist-dim); font-size:13px; padding:40px; text-align:center; background:var(--navy-panel); border:1px dashed var(--line); border-radius:var(--radius); }

  .cliente-cards{ display:flex; flex-direction:column; gap:12px; }
  .cliente-card{ display:flex; align-items:center; gap:16px; background:var(--navy-panel); border:1px solid var(--line-strong); border-radius:16px; padding:16px 18px; flex-wrap:wrap; }
  .cliente-avatar{ width:42px; height:42px; border-radius:50%; background:conic-gradient(from 200deg, var(--blue-bright), var(--blue-deep), var(--blue-bright)); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cliente-avatar .in{ width:36px; height:36px; border-radius:50%; background:var(--navy-panel); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--blue-glow); }
  .cliente-info{ flex:1; min-width:180px; }
  .cliente-info .nombre{ font-weight:700; font-size:14.5px; }
  .cliente-info .sub{ font-size:12px; color:var(--mist-dim); margin-top:2px; }
  .cliente-total{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; white-space:nowrap; }
  .btn-ver{ border:none; border-radius:9px; padding:10px 18px; font-size:12.5px; font-weight:600; cursor:pointer; background:linear-gradient(90deg, var(--blue-deep), var(--blue-bright)); color:var(--white); white-space:nowrap; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(2,6,14,0.8); z-index:200; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .modal-overlay.active{ display:flex; }
  .modal{ width:100%; max-width:640px; background:var(--navy-panel); border:1px solid var(--line-strong); border-radius:18px; padding:26px; max-height:88vh; overflow-y:auto; margin:auto; }
  .modal h2{ font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:4px; }
  .modal .lead{ color:var(--mist-dim); font-size:12.5px; margin-bottom:18px; }

  .solicitud-row{ background:var(--navy-panel-2); border:1px solid var(--line); border-radius:13px; padding:14px 16px; margin-bottom:10px; }
  .solicitud-row .row1{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .solicitud-row .item-nombre{ font-weight:700; font-size:14px; }
  .solicitud-row .precio{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; }
  .solicitud-row .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tipo-tag{ font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; padding:2px 7px; border-radius:20px; letter-spacing:.4px; }
  .tipo-tag.producto{ color:var(--blue-glow); border:1px solid var(--line-strong); }
  .tipo-tag.servicio{ color:#7bd88f; border:1px solid rgba(123,216,143,0.3); }
  .tipo-tag.mascota{ color:var(--mist); border:1px solid var(--line); }
  .solicitud-row .meta{ font-size:11.5px; color:var(--mist-dim); margin-bottom:10px; }
  .solicitud-actions{ display:flex; gap:8px; }
  .btn-aprobar{ flex:1; border:none; border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:600; cursor:pointer; background:linear-gradient(90deg, var(--blue-deep), var(--blue-bright)); color:var(--white); }
  .btn-denegar{ flex:1; border:1px solid rgba(255,107,107,0.35); border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:600; cursor:pointer; background:transparent; color:var(--danger); }
  .solicitud-row.denegada{ opacity:.75; }
  .denegada-tag{ font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; padding:4px 10px; border-radius:20px; background:rgba(255,107,107,0.12); color:var(--danger); border:1px solid rgba(255,107,107,0.3); display:inline-block; }
  .modal-close{ margin-top:6px; width:100%; padding:10px; border:1px solid var(--line); background:none; border-radius:10px; color:var(--mist); font-size:13px; cursor:pointer; }
</style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <script src="sidebar-inline.js?v=11" data-active="servicios"></script>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="crumbs">Panel &nbsp;/&nbsp; Tienda &nbsp;/&nbsp; <b>Solicitudes</b></div>
      </div>
      <div class="top-right">
        <div class="clock" id="clock">— — —</div>
      </div>
    </div>

    <a href="tienda.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Volver a Tienda
    </a>

    <div class="page-header">
      <div>
        <h1>Solicitudes de Tienda</h1>
        <p>Compras pendientes de aprobación, agrupadas por Acudiente.</p>
      </div>
    </div>

    <div class="toolbar-tabs">
      <div class="tab-pill active" data-tab="pendientes">Pendientes <span class="count" id="countPendientes">0</span></div>
      <div class="tab-pill" data-tab="denegadas" id="tabDenegadas" style="display:none;">Denegadas <span class="count" id="countDenegadas">0</span></div>
    </div>

    <div id="vistaPendientes">
      <div class="cliente-cards" id="clientesGrid">
        <div class="empty-note">Cargando…</div>
      </div>
    </div>

    <div id="vistaDenegadas" style="display:none;">
      <div class="cliente-cards" id="denegadasGrid">
        <div class="empty-note">Cargando…</div>
      </div>
    </div>
  </main>

  <!-- Modal: solicitudes de un acudiente -->
  <div class="modal-overlay" id="detalleOverlay">
    <div class="modal">
      <h2 id="detalleTitulo">Solicitudes</h2>
      <p class="lead">Revisa cada una y decide si la aceptas o la deniegas.</p>
      <div id="detalleLista"></div>
      <button class="modal-close" id="detalleCloseBtn">Cerrar</button>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './layout.js?v=11';
    import { supabase } from './supabaseClient.js?v=11';

    let esAdmin = false;
    let pendientes = [];
    let denegadas = [];

    (async () => {
      const profile = await initLayout({ activeKey: 'servicios' });
      if (!profile) return;

      let puedeVer = false;
      if (profile.role === 'admin') {
        puedeVer = true;
        esAdmin = true;
      } else if (profile.role === 'trabajador') {
        const { data } = await supabase
          .from('trabajador_detalle')
          .select('modulos_edicion')
          .eq('id', profile.id)
          .single();
        puedeVer = !!data?.modulos_edicion?.includes('servicios');
      }

      if (!puedeVer) {
        window.location.href = 'tienda.html';
        return;
      }

      if (esAdmin) document.getElementById('tabDenegadas').style.display = 'flex';

      await cargarPendientes();
      suscribirEnVivo();
    })();

    function suscribirEnVivo(){
      supabase
        .channel('solicitudes-tienda-cambios')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'compras' }, () => {
          cargarPendientes();
          if (esAdmin) cargarDenegadas();
        })
        .subscribe();
    }

    function agruparPorCliente(lista){
      const grupos = new Map();
      lista.forEach(c => {
        const key = c.cliente_id;
        if (!grupos.has(key)) {
          grupos.set(key, { cliente_id: key, nombre_cliente: c.nombre_cliente || 'Acudiente', items: [], total: 0 });
        }
        const g = grupos.get(key);
        g.items.push(c);
        g.total += Number(c.precio_total);
      });
      return [...grupos.values()].sort((a, b) => b.items.length - a.items.length);
    }

    function iniciales(nombre){
      return (nombre || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]?.toUpperCase() || '').join('');
    }

    function infoLinea(c){
      const partes = [];
      if (c.nombre_alumno) partes.push(`Mascota: ${c.nombre_alumno}`);
      if (c.cantidad && c.cantidad > 1) partes.push(`Cantidad: ${c.cantidad}`);
      if (c.fecha_checkin && c.fecha_checkout) partes.push(`${c.fecha_checkin} → ${c.fecha_checkout} (${c.noches} días)`);
      const fecha = new Date(c.created_at);
      partes.push(`Pedido: ${fecha.toLocaleDateString('es-CO')} ${fecha.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}`);
      return partes.join(' · ');
    }

    async function cargarPendientes(){
      const { data, error } = await supabase
        .from('compras')
        .select('*')
        .eq('estado_aprobacion', 'pendiente')
        .order('created_at', { ascending: true });

      const grid = document.getElementById('clientesGrid');
      if (error) {
        grid.innerHTML = `<div class="empty-note">No se pudieron cargar las solicitudes.</div>`;
        return;
      }

      pendientes = data || [];
      document.getElementById('countPendientes').textContent = pendientes.length;

      if (pendientes.length === 0) {
        grid.innerHTML = `<div class="empty-note">No hay solicitudes de compra pendientes.</div>`;
        return;
      }

      const grupos = agruparPorCliente(pendientes);
      grid.innerHTML = grupos.map(g => `
        <div class="cliente-card">
          <div class="cliente-avatar"><div class="in">${iniciales(g.nombre_cliente)}</div></div>
          <div class="cliente-info">
            <div class="nombre">${g.nombre_cliente}</div>
            <div class="sub">${g.items.length} solicitud${g.items.length !== 1 ? 'es' : ''} pendiente${g.items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="cliente-total">$ ${g.total.toLocaleString('es-CO')}</div>
          <button class="btn-ver" data-cliente="${g.cliente_id}">Ver</button>
        </div>
      `).join('');

      grid.querySelectorAll('[data-cliente]').forEach(btn => {
        btn.addEventListener('click', () => abrirDetalleCliente(btn.dataset.cliente, 'pendientes'));
      });
    }

    async function cargarDenegadas(){
      const { data, error } = await supabase
        .from('compras')
        .select('*')
        .eq('estado_aprobacion', 'denegado')
        .order('created_at', { ascending: false });

      const grid = document.getElementById('denegadasGrid');
      if (error) {
        grid.innerHTML = `<div class="empty-note">No se pudieron cargar las denegadas.</div>`;
        return;
      }

      denegadas = data || [];
      document.getElementById('countDenegadas').textContent = denegadas.length;

      if (denegadas.length === 0) {
        grid.innerHTML = `<div class="empty-note">No hay solicitudes denegadas.</div>`;
        return;
      }

      const grupos = agruparPorCliente(denegadas);
      grid.innerHTML = grupos.map(g => `
        <div class="cliente-card">
          <div class="cliente-avatar"><div class="in">${iniciales(g.nombre_cliente)}</div></div>
          <div class="cliente-info">
            <div class="nombre">${g.nombre_cliente}</div>
            <div class="sub">${g.items.length} denegada${g.items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="cliente-total">$ ${g.total.toLocaleString('es-CO')}</div>
          <button class="btn-ver" data-cliente="${g.cliente_id}">Ver</button>
        </div>
      `).join('');

      grid.querySelectorAll('[data-cliente]').forEach(btn => {
        btn.addEventListener('click', () => abrirDetalleCliente(btn.dataset.cliente, 'denegadas'));
      });
    }

    // ---------------- Tabs ----------------
    document.querySelectorAll('.tab-pill').forEach(tab => {
      tab.addEventListener('click', async () => {
        document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const key = tab.dataset.tab;
        document.getElementById('vistaPendientes').style.display = key === 'pendientes' ? 'block' : 'none';
        document.getElementById('vistaDenegadas').style.display = key === 'denegadas' ? 'block' : 'none';
        if (key === 'denegadas') await cargarDenegadas();
      });
    });

    // ---------------- Modal de detalle por acudiente ----------------
    const detalleOverlay = document.getElementById('detalleOverlay');
    let clienteModalActual = null;
    let origenModalActual = null;

    function abrirDetalleCliente(clienteId, origen){
      const fuente = origen === 'pendientes' ? pendientes : denegadas;
      const items = fuente.filter(c => c.cliente_id === clienteId);
      if (items.length === 0) return;

      clienteModalActual = clienteId;
      origenModalActual = origen;
      document.getElementById('detalleTitulo').textContent = items[0].nombre_cliente || 'Acudiente';
      pintarDetalleLista(items, origen);
      detalleOverlay.classList.add('active');
    }

    function pintarDetalleLista(items, origen){
      const cont = document.getElementById('detalleLista');
      cont.innerHTML = items.map(c => `
        <div class="solicitud-row ${origen === 'denegadas' ? 'denegada' : ''}">
          <div class="row1">
            <span class="item-nombre">${c.nombre_item}</span>
            <span class="precio">$ ${Number(c.precio_total).toLocaleString('es-CO')}</span>
          </div>
          <div class="tags">
            <span class="tipo-tag ${c.tipo_item}">${c.tipo_item === 'producto' ? 'Producto' : 'Servicio'}</span>
            ${c.nombre_alumno ? `<span class="tipo-tag mascota">🐾 ${c.nombre_alumno}</span>` : ''}
          </div>
          <div class="meta">${infoLinea(c)}</div>
          ${origen === 'pendientes' ? `
            <div class="solicitud-actions">
              <button class="btn-aprobar" data-action="aprobar" data-id="${c.id}">Aceptar</button>
              <button class="btn-denegar" data-action="denegar" data-id="${c.id}">Denegar</button>
            </div>
          ` : `<span class="denegada-tag">Denegada</span>`}
        </div>
      `).join('');

      cont.querySelectorAll('[data-action="aprobar"]').forEach(btn => {
        btn.addEventListener('click', () => resolverCompra(btn.dataset.id, 'aprobado'));
      });
      cont.querySelectorAll('[data-action="denegar"]').forEach(btn => {
        btn.addEventListener('click', () => resolverCompra(btn.dataset.id, 'denegado'));
      });
    }

    async function resolverCompra(id, estado){
      if (estado === 'denegado' && !confirm('¿Denegar esta solicitud de compra?')) return;

      const { error } = await supabase.from('compras').update({ estado_aprobacion: estado }).eq('id', id);
      if (error) {
        alert('No se pudo actualizar: ' + error.message);
        return;
      }

      await cargarPendientes();
      if (esAdmin) await cargarDenegadas();

      // Refresca el modal con lo que quede pendiente de este mismo
      // acudiente; si ya no queda nada, se cierra solo.
      const restantes = pendientes.filter(c => c.cliente_id === clienteModalActual);
      if (restantes.length === 0) {
        detalleOverlay.classList.remove('active');
      } else {
        pintarDetalleLista(restantes, 'pendientes');
      }
    }

    document.getElementById('detalleCloseBtn').addEventListener('click', () => detalleOverlay.classList.remove('active'));
  </script>
</body>
</html>
