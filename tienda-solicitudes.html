<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barkly">
<title>Talento Canes · Solicitudes de Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css?v=15">
<script src="theme-inline.js?v=15"></script>
<style>
  .back-link{ display:inline-flex; align-items:center; gap:6px; height:40px; font-size:var(--t-sm); font-weight:500; color:var(--text-2); background:none; border:none; cursor:pointer; text-decoration:none; margin-bottom:var(--s-3); }
  .back-link:hover{ color:var(--text); }
  .back-link svg{ width:16px; height:16px; }

  .page-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s-4); margin-bottom:var(--s-5); flex-wrap:wrap; }
  .page-header h1{ font-size:var(--t-2xl); }
  .page-header p{ color:var(--text-2); margin-top:4px; }

  .toolbar-tabs{ display:flex; gap:var(--s-5); border-bottom:1px solid var(--border); margin-bottom:var(--s-5); overflow-x:auto; scrollbar-width:none; }
  .toolbar-tabs::-webkit-scrollbar{ height:0; }
  .tab-pill{ display:inline-flex; align-items:center; gap:6px; padding:var(--s-3) 0; border:none; background:none; cursor:pointer; white-space:nowrap;
    font-size:var(--t-base); font-weight:500; color:var(--text-2); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-pill.active{ color:var(--text); font-weight:600; border-bottom-color:var(--acento); }
  .tab-pill .count{ min-width:20px; height:20px; padding:0 6px; border-radius:var(--r-full); background:var(--danger); color:#fff; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }

  .empty-note{ color:var(--text-2); font-size:var(--t-base); padding:var(--s-14) var(--s-6); text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); }

  /* ---------- Acudientes con solicitudes ---------- */
  .cliente-cards{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; }
  .cliente-card{ display:flex; align-items:center; gap:var(--s-4); min-height:76px; padding:var(--s-3) var(--s-5); border-bottom:1px solid var(--border); flex-wrap:wrap; transition:background .12s ease; }
  .cliente-card:last-child{ border-bottom:none; }
  .cliente-card:hover{ background:var(--surface-2); }
  .cliente-avatar{ width:44px; height:44px; border-radius:var(--r-full); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:var(--t-sm); }
  .cliente-avatar .in{ display:block; }
  .cliente-info{ flex:1; min-width:150px; }
  .cliente-info .nombre{ font-size:var(--t-base); font-weight:600; }
  .cliente-info .sub{ font-size:var(--t-sm); color:var(--text-2); margin-top:2px; }
  .ultimo-pedido{ font-size:var(--t-sm); color:var(--text-3); margin-top:1px; }
  .cliente-total{ font-size:var(--t-md); font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .btn-ver{ height:36px; padding:0 var(--s-4); border:1px solid var(--border-2); background:var(--surface); border-radius:var(--r-sm); color:var(--text); font-size:var(--t-sm); font-weight:500; cursor:pointer; white-space:nowrap; }
  .btn-ver:hover{ background:var(--surface-2); }
  @media (max-width:680px){
    .cliente-card{ padding:var(--s-3) var(--s-4); }
    .btn-ver{ height:44px; width:100%; }
  }

  /* ---------- Modal / hoja ---------- */
  .modal-overlay{ display:none; position:fixed; inset:0; z-index:200; background:rgba(9,12,17,.45); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); align-items:center; justify-content:center; padding:var(--s-5); overflow-y:auto; }
  .modal-overlay.active{ display:flex; }
  .modal{ width:100%; max-width:620px; margin:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-3); padding:var(--s-6); }
  .modal h2{ font-size:var(--t-lg); margin-bottom:6px; }
  .modal .lead{ color:var(--text-2); font-size:var(--t-sm); line-height:1.5; margin-bottom:var(--s-5); }
  .modal-close{ width:100%; height:44px; margin-top:var(--s-4); border:1px solid var(--border-2); background:none; border-radius:var(--r-sm); color:var(--text-2); font-size:var(--t-base); font-weight:500; cursor:pointer; }
  .modal-close:hover{ background:var(--surface-2); color:var(--text); }
  @media (max-width:1023px){
    .modal-overlay{ padding:0; align-items:flex-end; }
    .modal{ max-width:none; margin:0; max-height:92dvh; overflow-y:auto;
      border-radius:var(--r-xl) var(--r-xl) 0 0; border-left:none; border-right:none; border-bottom:none;
      padding:var(--s-5) var(--s-4) calc(var(--s-6) + var(--safe-b)); }
  }

  /* ---------- Cada solicitud ---------- */
  .solicitud-row{ padding:var(--s-4) 0; border-bottom:1px solid var(--border); }
  .solicitud-row:last-of-type{ border-bottom:none; }
  .solicitud-row .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-3); }
  .solicitud-row .item-nombre{ font-size:var(--t-base); font-weight:600; }
  .solicitud-row .precio{ font-size:var(--t-base); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .solicitud-row .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tipo-tag{ display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:var(--r-full); font-size:var(--t-xs); font-weight:600; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); white-space:nowrap; }
  .tipo-tag.mascota{ background:var(--acento-suave); color:var(--acento-txt); border-color:transparent; }
  .solicitud-row .meta{ font-size:var(--t-sm); color:var(--text-2); margin-top:6px; line-height:1.5; }
  .solicitud-actions{ display:flex; gap:var(--s-2); margin-top:var(--s-3); }
  .btn-aprobar{ height:38px; padding:0 var(--s-4); border:none; border-radius:var(--r-sm); background:var(--acento); color:#fff; font-size:var(--t-sm); font-weight:600; cursor:pointer; }
  .btn-aprobar:hover{ background:var(--acento-hover); }
  .btn-denegar{ height:38px; padding:0 var(--s-4); border:1px solid var(--border-2); background:none; border-radius:var(--r-sm); color:var(--text-2); font-size:var(--t-sm); font-weight:500; cursor:pointer; }
  .btn-denegar:hover{ color:var(--danger); border-color:var(--danger-br); }
  .solicitud-row.denegada{ opacity:.75; }
  .denegada-tag{ font-size:var(--t-xs); font-weight:600; color:var(--danger); }
  @media (max-width:680px){
    .solicitud-actions button{ flex:1; height:44px; }
  }
</style>
</head>
<body>

  <script src="shell-inline.js?v=15" data-active="servicios" data-title="Solicitudes"></script>

  <main>
    <a href="tienda.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Volver a Tienda
    </a>

    <div class="page-header">
      <div>
        <h1>Solicitudes de Tienda</h1>
        <p>Compras pendientes de aprobación, agrupadas por Acudiente.</p>
      </div>
    </div>

    <div class="toolbar-tabs">
      <div class="tab-pill active" data-tab="pendientes">Pendientes <span class="count" id="countPendientes">0</span></div>
      <div class="tab-pill" data-tab="denegadas" id="tabDenegadas" style="display:none;">Denegadas <span class="count" id="countDenegadas">0</span></div>
    </div>

    <div id="vistaPendientes">
      <div class="cliente-cards" id="clientesGrid">
        <div class="empty-note">Cargando…</div>
      </div>
    </div>

    <div id="vistaDenegadas" style="display:none;">
      <div class="cliente-cards" id="denegadasGrid">
        <div class="empty-note">Cargando…</div>
      </div>
    </div>
  </main>

  <!-- Modal: solicitudes de un acudiente -->
  <div class="modal-overlay" id="detalleOverlay">
    <div class="modal">
      <h2 id="detalleTitulo">Solicitudes</h2>
      <p class="lead">Revisa cada una y decide si la aceptas o la deniegas.</p>
      <div id="detalleLista"></div>
      <button class="modal-close" id="detalleCloseBtn">Cerrar</button>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './layout.js?v=15';
    import { supabase } from './supabaseClient.js?v=15';
    import { escapar, colorDeNombre, iniciales } from './ui.js?v=15';

    let esAdmin = false;
    let pendientes = [];
    let denegadas = [];

    (async () => {
      const profile = await initLayout({ activeKey: 'servicios' });
      if (!profile) return;

      let puedeVer = false;
      if (profile.role === 'admin') {
        puedeVer = true;
        esAdmin = true;
      } else if (profile.role === 'trabajador') {
        const { data } = await supabase
          .from('trabajador_detalle')
          .select('modulos_edicion')
          .eq('id', profile.id)
          .single();
        puedeVer = !!data?.modulos_edicion?.includes('servicios');
      }

      if (!puedeVer) {
        window.location.href = 'tienda.html';
        return;
      }

      if (esAdmin) document.getElementById('tabDenegadas').style.display = 'flex';

      await cargarPendientes();
      suscribirEnVivo();
    })();

    function suscribirEnVivo(){
      supabase
        .channel('solicitudes-tienda-cambios')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'compras' }, () => {
          cargarPendientes();
          if (esAdmin) cargarDenegadas();
        })
        .subscribe();
    }

    function agruparPorCliente(lista){
      const grupos = new Map();
      lista.forEach(c => {
        const key = c.cliente_id;
        if (!grupos.has(key)) {
          grupos.set(key, { cliente_id: key, nombre_cliente: c.nombre_cliente || 'Acudiente', items: [], total: 0, ultimoPedido: null });
        }
        const g = grupos.get(key);
        g.items.push(c);
        g.total += Number(c.precio_total);
        const fechaItem = new Date(c.created_at);
        if (!g.ultimoPedido || fechaItem > g.ultimoPedido) g.ultimoPedido = fechaItem;
      });
      return [...grupos.values()].sort((a, b) => b.items.length - a.items.length);
    }

    function formatearFechaHora(fecha){
      return `${fecha.toLocaleDateString('es-CO')} ${fecha.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}`;
    }

    function infoLinea(c){
      const partes = [];
      if (c.nombre_alumno) partes.push(`Mascota: ${c.nombre_alumno}`);
      if (c.cantidad && c.cantidad > 1) partes.push(`Cantidad: ${c.cantidad}`);
      if (c.fecha_checkin && c.fecha_checkout) partes.push(`${c.fecha_checkin} → ${c.fecha_checkout} (${c.noches} días)`);
      const fecha = new Date(c.created_at);
      partes.push(`Pedido: ${fecha.toLocaleDateString('es-CO')} ${fecha.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}`);
      return partes.join(' · ');
    }

    async function cargarPendientes(){
      const { data, error } = await supabase
        .from('compras')
        .select('*')
        .eq('estado_aprobacion', 'pendiente')
        .order('created_at', { ascending: true });

      const grid = document.getElementById('clientesGrid');
      if (error) {
        grid.innerHTML = `<div class="empty-note">No se pudieron cargar las solicitudes.</div>`;
        return;
      }

      pendientes = data || [];
      document.getElementById('countPendientes').textContent = pendientes.length;

      if (pendientes.length === 0) {
        grid.innerHTML = `<div class="empty-note">No hay solicitudes de compra pendientes.</div>`;
        return;
      }

      const grupos = agruparPorCliente(pendientes);
      grid.innerHTML = grupos.map(g => `
        <div class="cliente-card">
          <div class="cliente-avatar" style="background:${colorDeNombre(g.nombre_cliente)}"><div class="in">${escapar(iniciales(g.nombre_cliente))}</div></div>
          <div class="cliente-info">
            <div class="nombre">${g.nombre_cliente}</div>
            <div class="sub">${g.items.length} solicitud${g.items.length !== 1 ? 'es' : ''} pendiente${g.items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="ultimo-pedido">Último pedido<br>${formatearFechaHora(g.ultimoPedido)}</div>
          <div class="cliente-total">$ ${g.total.toLocaleString('es-CO')}</div>
          <button class="btn-ver" data-cliente="${g.cliente_id}">Ver</button>
        </div>
      `).join('');

      grid.querySelectorAll('[data-cliente]').forEach(btn => {
        btn.addEventListener('click', () => abrirDetalleCliente(btn.dataset.cliente, 'pendientes'));
      });
    }

    async function cargarDenegadas(){
      const { data, error } = await supabase
        .from('compras')
        .select('*')
        .eq('estado_aprobacion', 'denegado')
        .order('created_at', { ascending: false });

      const grid = document.getElementById('denegadasGrid');
      if (error) {
        grid.innerHTML = `<div class="empty-note">No se pudieron cargar las denegadas.</div>`;
        return;
      }

      denegadas = data || [];
      document.getElementById('countDenegadas').textContent = denegadas.length;

      if (denegadas.length === 0) {
        grid.innerHTML = `<div class="empty-note">No hay solicitudes denegadas.</div>`;
        return;
      }

      const grupos = agruparPorCliente(denegadas);
      grid.innerHTML = grupos.map(g => `
        <div class="cliente-card">
          <div class="cliente-avatar" style="background:${colorDeNombre(g.nombre_cliente)}"><div class="in">${escapar(iniciales(g.nombre_cliente))}</div></div>
          <div class="cliente-info">
            <div class="nombre">${g.nombre_cliente}</div>
            <div class="sub">${g.items.length} denegada${g.items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="ultimo-pedido">Último pedido<br>${formatearFechaHora(g.ultimoPedido)}</div>
          <div class="cliente-total">$ ${g.total.toLocaleString('es-CO')}</div>
          <button class="btn-ver" data-cliente="${g.cliente_id}">Ver</button>
        </div>
      `).join('');

      grid.querySelectorAll('[data-cliente]').forEach(btn => {
        btn.addEventListener('click', () => abrirDetalleCliente(btn.dataset.cliente, 'denegadas'));
      });
    }

    // ---------------- Tabs ----------------
    document.querySelectorAll('.tab-pill').forEach(tab => {
      tab.addEventListener('click', async () => {
        document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const key = tab.dataset.tab;
        document.getElementById('vistaPendientes').style.display = key === 'pendientes' ? 'block' : 'none';
        document.getElementById('vistaDenegadas').style.display = key === 'denegadas' ? 'block' : 'none';
        if (key === 'denegadas') await cargarDenegadas();
      });
    });

    // ---------------- Modal de detalle por acudiente ----------------
    const detalleOverlay = document.getElementById('detalleOverlay');
    let clienteModalActual = null;
    let origenModalActual = null;

    function abrirDetalleCliente(clienteId, origen){
      const fuente = origen === 'pendientes' ? pendientes : denegadas;
      const items = fuente.filter(c => c.cliente_id === clienteId);
      if (items.length === 0) return;

      clienteModalActual = clienteId;
      origenModalActual = origen;
      document.getElementById('detalleTitulo').textContent = items[0].nombre_cliente || 'Acudiente';
      pintarDetalleLista(items, origen);
      detalleOverlay.classList.add('active');
    }

    function pintarDetalleLista(items, origen){
      const cont = document.getElementById('detalleLista');
      cont.innerHTML = items.map(c => `
        <div class="solicitud-row ${origen === 'denegadas' ? 'denegada' : ''}">
          <div class="row1">
            <span class="item-nombre">${c.nombre_item}</span>
            <span class="precio">$ ${Number(c.precio_total).toLocaleString('es-CO')}</span>
          </div>
          <div class="tags">
            <span class="tipo-tag ${c.tipo_item}">${c.tipo_item === 'producto' ? 'Producto' : 'Servicio'}</span>
            ${c.nombre_alumno ? `<span class="tipo-tag mascota">🐾 ${c.nombre_alumno}</span>` : ''}
          </div>
          <div class="meta">${infoLinea(c)}</div>
          ${origen === 'pendientes' ? `
            <div class="solicitud-actions">
              <button class="btn-aprobar" data-action="aprobar" data-id="${c.id}">Aceptar</button>
              <button class="btn-denegar" data-action="denegar" data-id="${c.id}">Denegar</button>
            </div>
          ` : `
            <div class="solicitud-actions">
              <span class="denegada-tag">Denegada</span>
              <button class="btn-denegar" data-action="eliminar" data-id="${c.id}">Eliminar definitivamente</button>
            </div>
          `}
        </div>
      `).join('');

      cont.querySelectorAll('[data-action="aprobar"]').forEach(btn => {
        btn.addEventListener('click', () => resolverCompra(btn.dataset.id, 'aprobado'));
      });
      cont.querySelectorAll('[data-action="denegar"]').forEach(btn => {
        btn.addEventListener('click', () => resolverCompra(btn.dataset.id, 'denegado'));
      });
      cont.querySelectorAll('[data-action="eliminar"]').forEach(btn => {
        btn.addEventListener('click', () => eliminarCompra(btn.dataset.id));
      });
    }

    async function eliminarCompra(id){
      if (!confirm('¿Eliminar esta solicitud denegada para siempre? No se puede deshacer.')) return;

      const { error } = await supabase.from('compras').delete().eq('id', id);
      if (error) {
        alert('No se pudo eliminar: ' + error.message);
        return;
      }

      await cargarDenegadas();

      const restantes = denegadas.filter(c => c.cliente_id === clienteModalActual);
      if (restantes.length === 0) {
        detalleOverlay.classList.remove('active');
      } else {
        pintarDetalleLista(restantes, 'denegadas');
      }
    }

    async function resolverCompra(id, estado){
      if (estado === 'denegado' && !confirm('¿Denegar esta solicitud de compra?')) return;

      const { error } = await supabase.from('compras').update({ estado_aprobacion: estado }).eq('id', id);
      if (error) {
        alert('No se pudo actualizar: ' + error.message);
        return;
      }

      await cargarPendientes();
      if (esAdmin) await cargarDenegadas();

      // Refresca el modal con lo que quede pendiente de este mismo
      // acudiente; si ya no queda nada, se cierra solo.
      const restantes = pendientes.filter(c => c.cliente_id === clienteModalActual);
      if (restantes.length === 0) {
        detalleOverlay.classList.remove('active');
      } else {
        pintarDetalleLista(restantes, 'pendientes');
      }
    }

    document.getElementById('detalleCloseBtn').addEventListener('click', () => detalleOverlay.classList.remove('active'));
  </script>
</body>
</html>
