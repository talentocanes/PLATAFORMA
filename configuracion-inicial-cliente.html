<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barkly">
<title>Talento Canes · Completa tu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="theme-inline.js?v=15"></script>
<link rel="stylesheet" href="panel.css?v=15">
<style>
  /* Páginas de acceso: sin armazón, solo una tarjeta centrada.
     Todo sale de los tokens de panel.css, así que también siguen
     la paleta del colegio y el modo claro/oscuro. */
  body{ padding:0 var(--s-4); }

  .card{
    width:100%; max-width:900px;
    margin:var(--s-14) auto var(--s-18);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-2);
    padding:var(--s-8) var(--s-6);
  }
  @media (max-width:560px){
    .card{ margin-top:var(--s-6); margin-bottom:var(--s-10); padding:var(--s-6) var(--s-5); }
    body{ padding:0 var(--s-3); }
  }

  .eyebrow{ font-size:var(--t-sm); font-weight:600; color:var(--acento-txt); margin-bottom:var(--s-2); }
  h1{ font-size:var(--t-xl); font-weight:700; letter-spacing:-0.02em; line-height:1.2; margin-bottom:6px; }
  .lead{ color:var(--text-2); font-size:var(--t-sm); line-height:1.55; margin-bottom:var(--s-6); }

  .section-title{ font-size:var(--t-sm); font-weight:600; color:var(--text-2); margin:var(--s-6) 0 var(--s-3); }
  .section-title:first-of-type{ margin-top:0; }

  .field{ margin-bottom:var(--s-4); }
  .field label, label{ display:block; font-size:var(--t-sm); font-weight:500; color:var(--text); margin-bottom:6px; }
  .field input, .field select, input, select{
    width:100%; height:44px; padding:0 var(--s-3);
    border:1px solid var(--border-2); border-radius:var(--r-sm);
    background:var(--surface); color:var(--text);
    font-size:var(--t-base); font-family:inherit; outline:none;
    transition:border-color .13s ease, box-shadow .13s ease;
  }
  .field input:focus, .field select:focus, input:focus, select:focus{
    border-color:var(--acento); box-shadow:0 0 0 3px var(--acento-suave);
  }
  .field input:disabled, input:disabled{ background:var(--surface-2); color:var(--text-3); cursor:default; }
  input::placeholder{ color:var(--text-3); }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-3); }
  .grid-3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--s-3); }
  @media (max-width:760px){ .grid-3{ grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

  /* iOS hace zoom al enfocar un campo con letra menor a 16px */
  @media (max-width:1023px){
    .field input, .field select, input, select, textarea{ height:50px; font-size:16px; }
  }

  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:48px; }
  .toggle-password{
    position:absolute; top:50%; right:4px; transform:translateY(-50%);
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; cursor:pointer; color:var(--text-3);
    border-radius:var(--r-full);
  }
  .toggle-password:hover{ color:var(--text-2); background:var(--surface-2); }
  .toggle-password svg{ width:19px; height:19px; }
  .toggle-password .eye-off{ display:none; }
  .toggle-password.showing .eye{ display:none; }
  .toggle-password.showing .eye-off{ display:block; }

  button, .btn-save{
    width:100%; height:48px; margin-top:var(--s-3);
    border:none; border-radius:var(--r-sm);
    background:var(--acento); color:#fff;
    font-family:inherit; font-weight:600; font-size:var(--t-md); cursor:pointer;
  }
  button:hover:not(:disabled), .btn-save:hover:not(:disabled){ background:var(--acento-hover); }
  button:disabled, .btn-save:disabled{ opacity:.55; cursor:default; }
  /* El ojo de la contraseña no es un botón de acción */
  button.toggle-password{ width:40px; height:40px; margin:0; background:none; }
  button.toggle-password:hover{ background:var(--surface-2); }

  .msg{ margin-top:var(--s-4); padding:var(--s-3) var(--s-4); border-radius:var(--r-sm); font-size:var(--t-sm); line-height:1.5; display:none; }
  .msg.error{ display:block; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-br); }
  .msg.info{ display:block; background:var(--acento-suave); color:var(--acento-txt); border:1px solid transparent; }

  .success{ text-align:center; padding:var(--s-4) 0; }
  .success .icon{ width:52px; height:52px; margin:0 auto var(--s-4); border-radius:var(--r-full);
    background:var(--ok-bg); border:1px solid var(--ok-br); color:var(--ok);
    display:flex; align-items:center; justify-content:center; }
  .success .icon svg{ width:26px; height:26px; }
  .hidden{ display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Talento Canes · Último paso</div>
    <h1>Completa tu perfil</h1>
    <p class="lead">Antes de continuar necesitamos algunos datos tuyos. Solo tienes que hacerlo una vez.</p>

    <form id="onboardingForm" autocomplete="off">
      <div class="section-title">Identificación</div>
      <div class="grid-3">
        <div class="field">
          <label>Tipo de persona</label>
          <select id="tipoPersona" autocomplete="off">
            <option value="natural">Persona natural</option>
            <option value="juridica">Persona jurídica</option>
          </select>
        </div>
        <div class="field">
          <label>Tipo de identificación</label>
          <select id="tipoIdentificacion" autocomplete="off"></select>
        </div>
        <div class="field">
          <label>Número de identificación</label>
          <input type="text" id="numeroIdentificacion" placeholder="Número de documento" autocomplete="off">
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label id="labelNombre">Nombre completo</label>
          <input type="text" id="fullName" autocomplete="off">
        </div>
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="username" disabled autocomplete="off">
        </div>
      </div>

      <div class="section-title">Contacto</div>
      <div class="grid-2">
        <div class="field">
          <label>Teléfono</label>
          <input type="text" id="phone" placeholder="3001234567" autocomplete="off">
        </div>
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" autocomplete="off">
        </div>
      </div>

      <div class="section-title">Ubicación</div>
      <div class="grid-3">
        <div class="field">
          <label>Departamento</label>
          <input type="text" id="departamento" placeholder="Escribe o elige un departamento" autocomplete="off">
        </div>
        <div class="field">
          <label>Ciudad / Municipio</label>
          <input type="text" id="ciudad" placeholder="Selecciona primero un departamento" autocomplete="off">
        </div>
        <div class="field">
          <label>Dirección</label>
          <input type="text" id="direccion" placeholder="Calle, carrera, número..." autocomplete="off">
        </div>
      </div>

      <div id="securitySection" style="display:none;">
        <div class="section-title">Seguridad</div>
        <div class="grid-3">
          <div class="field">
            <label>Contraseña temporal (la que te dieron)</label>
            <div class="password-wrap">
              <input type="password" id="currentPassword" autocomplete="current-password">
              <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Mostrar">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>Nueva contraseña</label>
            <div class="password-wrap">
              <input type="password" id="newPassword" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="newPassword" aria-label="Mostrar">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>Confirmar contraseña</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6C3.4 8.7 1.5 12 1.5 12S5 19 12 19a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-save" id="saveBtn">Guardar y continuar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script type="module">
    import { protegerPagina } from './auth.js?v=15';
    import { supabase, usernameToEmail } from './supabaseClient.js?v=15';
    import { cargarConfiguracionNegocio } from './theme.js?v=15';
    import { capitalizarPalabras } from './textutils.js?v=15';
    import { initSelectorUbicacion } from './colombia.js?v=15';

    // Evita que el navegador "recuerde" y restaure una posición de
    // scroll de una carga anterior de esta misma página.
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Se refuerza varias veces: algunos navegadores intentan desplazar
    // la vista hacia los campos de contraseña (por el gestor de
    // contraseñas) después de que termina de cargar el formulario.
    function forzarScrollArriba(){
      window.scrollTo(0, 0);
    }
    forzarScrollArriba();
    window.addEventListener('load', forzarScrollArriba);
    setTimeout(forzarScrollArriba, 50);
    setTimeout(forzarScrollArriba, 300);
    setTimeout(forzarScrollArriba, 800);

    cargarConfiguracionNegocio();

    let profile = null;
    let requiereCambioPassword = false;

    const OPCIONES_ID = {
      natural: [ { v:'CC', l:'Cédula de ciudadanía' }, { v:'CE', l:'Cédula de extranjería' }, { v:'TI', l:'Tarjeta de identidad' } ],
      juridica: [ { v:'NIT', l:'NIT' } ]
    };

    function actualizarSegunTipoPersona(){
      const tipo = document.getElementById('tipoPersona').value;
      const selectId = document.getElementById('tipoIdentificacion');
      selectId.innerHTML = OPCIONES_ID[tipo].map(o => `<option value="${o.v}">${o.l}</option>`).join('');
      document.getElementById('labelNombre').textContent = tipo === 'juridica' ? 'Nombre completo o razón social' : 'Nombre completo';
    }

    document.getElementById('tipoPersona').addEventListener('change', actualizarSegunTipoPersona);
    actualizarSegunTipoPersona();

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.classList.toggle('showing', !showing);
      });
    });

    (async () => {
      profile = await protegerPagina({ rolesPermitidos: ['cliente'] });
      if (!profile) return;

      const { data: detalle, error } = await supabase
        .from('cliente_detalle')
        .select('*')
        .eq('id', profile.id)
        .single();

      if (error) {
        console.error('Error al leer cliente_detalle:', error);
      }

      // Si ya completó su perfil antes, no debería estar aquí
      if (detalle?.perfil_completo) {
        window.location.href = 'inicio.html';
        return;
      }

      requiereCambioPassword = !!profile.requiere_cambio_password;
      document.getElementById('securitySection').style.display = requiereCambioPassword ? 'block' : 'none';

      document.getElementById('username').value = profile.username;
      document.getElementById('fullName').value = profile.full_name || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('direccion').value = detalle?.direccion || '';
      document.getElementById('correo').value = detalle?.correo || '';

      const selectorUbicacion = initSelectorUbicacion(document.getElementById('departamento'), document.getElementById('ciudad'));
      selectorUbicacion.setValores(detalle?.departamento || '', detalle?.ciudad || '');

      if (detalle?.tipo_persona) {
        document.getElementById('tipoPersona').value = detalle.tipo_persona;
        actualizarSegunTipoPersona();
      }
      if (detalle?.tipo_identificacion) document.getElementById('tipoIdentificacion').value = detalle.tipo_identificacion;
      document.getElementById('numeroIdentificacion').value = detalle?.numero_identificacion || '';

      forzarScrollArriba();
      setTimeout(forzarScrollArriba, 50);
      setTimeout(forzarScrollArriba, 300);
    })();

    const msg = document.getElementById('msg');
    function showError(text){
      msg.textContent = text;
      msg.className = 'msg error';
    }

    document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const btn = document.getElementById('saveBtn');

      const fullName = capitalizarPalabras(document.getElementById('fullName').value.trim());
      const phone = document.getElementById('phone').value.trim();
      const departamento = document.getElementById('departamento').value;
      const ciudad = document.getElementById('ciudad').value;
      const direccion = document.getElementById('direccion').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const tipoPersona = document.getElementById('tipoPersona').value;
      const tipoIdentificacion = document.getElementById('tipoIdentificacion').value;
      const numeroIdentificacion = document.getElementById('numeroIdentificacion').value.trim();

      if (!fullName || !numeroIdentificacion || !phone) {
        showError('Completa al menos tu nombre, número de identificación y teléfono.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando…';

      try {
        if (requiereCambioPassword) {
          const currentPassword = document.getElementById('currentPassword').value;
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (!currentPassword || !newPassword) {
            throw new Error('Debes definir tu nueva contraseña.');
          }
          if (newPassword.length < 6) {
            throw new Error('La nueva contraseña debe tener al menos 6 caracteres.');
          }
          if (newPassword !== confirmPassword) {
            throw new Error('Las contraseñas no coinciden.');
          }

          // Verifica que la contraseña temporal ingresada sea correcta
          const email = usernameToEmail(profile.username);
          const { error: verifyErr } = await supabase.auth.signInWithPassword({ email, password: currentPassword });
          if (verifyErr) throw new Error('La contraseña temporal no es correcta.');

          const { error: updateErr } = await supabase.auth.updateUser({ password: newPassword });
          if (updateErr) throw new Error(updateErr.message);
        }

        const { error: rpcErr } = await supabase.rpc('completar_perfil_cliente', {
          p_full_name: fullName,
          p_phone: phone,
          p_direccion: direccion,
          p_correo: correo,
          p_tipo_persona: tipoPersona,
          p_tipo_identificacion: tipoIdentificacion,
          p_numero_identificacion: numeroIdentificacion,
          p_departamento: departamento || null,
          p_ciudad: ciudad || null
        });
        if (rpcErr) throw new Error(rpcErr.message);

        window.location.href = 'inicio.html';
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Guardar y continuar';
      }
    });
  </script>
</body>
</html>
